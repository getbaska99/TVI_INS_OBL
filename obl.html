        ]

      const [selectedInsurance, setSelectedInsurance] = useState('BCBS PPO');
      const [cptSettings, setCptSettings] = useState({});

      const insurers = ['Aetna', 'BCBS HMO', 'BCBS PPO', 'Cigna', 'Medicare', 'Humana', 'UHC'];

      const updateCptSetting = (code, field, value) => {
        setCptSettings(prev => ({
          ...prev,
          [code]: {
            ...prev[code],
            [field]: value
          }
        }));
      };

      const getCptSetting = (code, field) => {
        if (!cptSettings[code]) return field === 'quantity' ? 1 : 100;
        return cptSettings[code][field] !== undefined ? cptSettings[code][field] : (field === 'quantity' ? 1 : 100);
      };

      const resetSettings = () => {
        setCptSettings({});
      };

      const calculations = useMemo(() => {
        const currentProcedures = procedures[selectedProcedure];
        return currentProcedures.map(proc => {
          const basePrice = proc.prices[selectedInsurance];
          const quantity = getCptSetting(proc.code, 'quantity');
          const percentage = getCptSetting(proc.code, 'percentage');
          const finalPrice = basePrice * quantity * (percentage / 100);
          
          return {
            ...proc,
            basePrice,
            quantity,
            percentage,
            finalPrice
          };
        });
      }, [selectedProcedure, selectedInsurance, cptSettings]);

      const totalBasePrice = calculations.reduce((sum, calc) => sum + calc.basePrice, 0);

        'Aetna': 'bg-purple-600',
        'BCBS HMO': 'bg-blue-600',
        'BCBS PPO': 'bg-blue-700',
        'Cigna': 'bg-orange-600',
        'Medicare': 'bg-red-600',
        'Humana': 'bg-green-600',
        'UHC': 'bg-indigo-600'
      };

        return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };

        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-teal-900 p-4 md:p-6">

                  {insurers.map(ins => (

                </select>
              </div>

                  onClick={resetSettings}

                      <th className="px-4 py-3 text-center text-xs font-bold text-teal-400 uppercase tracking-wider">Qty</th>

                      <th className="px-4 py-3 text-right text-xs font-bold text-teal-400 uppercase tracking-wider">Final Price</th>

                  </thead>

                      <tr key={`${calc.code}-${idx}`} className={`${idx % 2 === 0 ? 'bg-slate-800/50' : 'bg-slate-800/30'} hover:bg-slate-700/50 transition-colors`}>

                            min="0"
                            max="99"

                        <td className="px-4 py-3 text-center">

                        <td className="px-4 py-3 text-right">
                          <span className={`font-bold text-lg ${calc.finalPrice > 0 ? 'text-emerald-400' : 'text-slate-500'}`}>
                            ${formatCurrency(calc.finalPrice)}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot className="bg-gradient-to-r from-teal-800/80 to-cyan-800/80 border-t-4 border-teal-500">
                    <tr>
                      <td colSpan="2" className="px-4 py-4 text-left text-lg font-bold text-white">
                        Total Procedure Cost
                      </td>
                      <td className="px-4 py-4 text-right text-slate-300">
                        ${formatCurrency(totalBasePrice)}
                      </td>
                      <td colSpan="2" className="px-4 py-4"></td>
                      <td className="px-4 py-4 text-right">
                        <span className="text-2xl font-bold text-emerald-400">
                          ${formatCurrency(totalPrice)}
                        </span>
                      </td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>

            {/* Summary Cards */}
            <div className="grid md:grid-cols-3 gap-4">
              <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl shadow-lg p-5 border border-slate-700">

            </div>

    const root = ReactDOM.createRoot(document.getElementById('root'));
